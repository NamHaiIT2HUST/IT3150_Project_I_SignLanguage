<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống nhận diện ngôn ngữ ký hiệu (Edge AI)</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Hệ thống nhận dạng ngôn ngữ ký hiệu <span class="badge-edge">Edge AI</span></h1>
    <div class="content-grid">
      <div class="left-panel">
        <div class="card device-section">
          <div class="card-title">
            <span>📡 Thiết bị Edge (ESP32-S3-CAM)</span>
            <span class="badge-live" id="conn-badge">Đang chờ...</span>
          </div>
          <div class="device-status">
            <div class="status-row">
              <span class="label-small">Trạng thái</span>
              <span id="status-text">--</span>
            </div>
            <div class="status-row">
              <span class="label-small">Độ tin cậy</span>
              <span id="confidence-text">--</span>
            </div>
          </div>
        </div>
        <div class="card cheatsheet-section">
          <div class="card-title">📖 Bảng Ký Hiệu (A-Z)</div>
          <div class="cheat-sheet-wrapper">
            <img src="{{ url_for('static', filename='asl_table_left_hand.jpg') }}" class="cheat-sheet-img" alt="Bảng mẫu">
          </div>
        </div>
      </div>
      <div class="right-panel">
        <div class="result-area">
          <div class="label-small">Ký Tự Nhận Diện</div>
          <div class="big-letter" id="live-char">--</div>
        </div>
        <div class="history-box" id="history-box">
          <span id="history-text"></span><span style="animation:pulse 1s infinite; font-weight:bold;">|</span>
        </div>
        <div class="button-group">
          <button class="btn-clear" onclick="clearHistory()">🗑 Xóa lịch sử</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function poll() {
      try {
        const res = await fetch('/state');
        const data = await res.json();

        document.getElementById('conn-badge').innerText = data.connected ? 'Live' : 'Mất kết nối';
        document.getElementById('conn-badge').style.background = data.connected ? '#f44336' : '#999';
        document.getElementById('status-text').innerText = data.connected ? 'Đang nhận diện' : 'Không có tín hiệu';

        const charEl = document.getElementById('live-char');
        charEl.innerText = data.char ? data.char : '--';

        document.getElementById('confidence-text').innerText =
          data.char ? (data.confidence * 100).toFixed(0) + '%' : '--';

        document.getElementById('history-text').innerText = data.history;
        const box = document.getElementById('history-box');
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        document.getElementById('conn-badge').innerText = 'Mất kết nối server';
      }
    }
    setInterval(poll, 300);
    poll();

    function clearHistory() {
      fetch('/clear', { method: 'POST' });
    }
  </script>
</body>
</html>
